name: soratra-dev

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: soratra
      POSTGRES_USER: soratra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/setup.sh first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U soratra -d soratra']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_dev_data:
