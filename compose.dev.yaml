# Database for working on Soratra with `npm run dev`. Listens on this computer
# only, with a fixed development password that matches .env.example.
name: soratra-dev

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: soratra
      POSTGRES_USER: soratra
      POSTGRES_PASSWORD: soratra
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U soratra -d soratra']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_dev_data:
