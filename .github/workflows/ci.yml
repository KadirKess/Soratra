name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these checks before publishing an image.
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: docker/ci/compose-config.sh

  # One image for every install scenario, so they all test the same build.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the image
        run: |
          docker build --tag ghcr.io/kadirkess/soratra:ci --build-arg SORATRA_VERSION=ci .
          docker save ghcr.io/kadirkess/soratra:ci | gzip -1 > "$RUNNER_TEMP/soratra-image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soratra-image
          path: ${{ runner.temp }}/soratra-image.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Whole installations in shapes container-e2e doesn't cover; see docker/ci/.
  install-scenarios:
    name: install scenario (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: [quality, image]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [lifecycle, fresh-install, caddy]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The lifecycle scenario starts from the previous release tag.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: matrix.scenario != 'caddy'
        run: npm ci
      - if: matrix.scenario != 'caddy'
        run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soratra-image
          path: ${{ runner.temp }}
      - run: gunzip -c "$RUNNER_TEMP/soratra-image.tar.gz" | docker load
      - run: docker/ci/${{ matrix.scenario }}.sh
      - if: failure() && matrix.scenario != 'caddy'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.scenario }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: soratra-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:compose.build.yaml:docker/compose.test.yaml
      # A port other than the container's own, like most real installs.
      SORATRA_PORT: 3100
      PLAYWRIGHT_BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and start isolated containers
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verify repeated migrations and the rescue command
        run: |
          docker compose exec -T app soratra migrate
          # An unknown reader must fail cleanly with status 1.
          status=0
          docker compose exec -T app soratra reset-link nobody_here || status=$?
          test "$status" -eq 1
      - name: Verify the first backup
        run: |
          for _ in $(seq 1 30); do
            docker compose logs backup | grep -q 'Backup written' && exit 0
            sleep 2
          done
          docker compose logs backup
          exit 1
      - name: Verify runtime health and corresponding source
        run: |
          curl --fail --silent --show-error http://localhost:3100/api/health
          curl --fail --silent --show-error http://localhost:3100/source.tar.gz -o "$RUNNER_TEMP/soratra-source.tar.gz"
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open(os.path.join(os.environ['RUNNER_TEMP'], 'soratra-source.tar.gz')) as archive:
              names = set(archive.getnames())
              required = {'LICENSE', 'NOTICE', 'TRADEMARKS.md', 'Dockerfile', 'compose.yaml', 'compose.build.yaml', 'compose.caddy.yaml', 'docker/compose.test.yaml', 'docker/soratra.sh', '.env.example', 'scripts/package-source.mjs'}
              assert required <= names, f'Missing source files: {required - names}'
              for name in names:
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not {'.git', 'node_modules', '.next', 'backups'}.intersection(path.parts)
                  assert not any(part.startswith('.env') and part != '.env.example' for part in path.parts)
          PY
      - run: npm run test:e2e
      - name: Inspect failed container startup or tests
        if: failure()
        run: docker compose logs --no-color --tail 200 init db app backup
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
