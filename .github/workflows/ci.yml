name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'codex/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:setup
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  container-e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: soratra-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/setup.mjs
      - name: Build and start isolated containers
        run: docker compose -f compose.yaml -f docker/compose.test.yaml up -d --build --wait --wait-timeout 180
      - name: Verify repeated migrations
        run: docker compose -f compose.yaml -f docker/compose.test.yaml run --rm migrate
      - name: Verify runtime health and corresponding source
        run: |
          curl --fail --silent --show-error http://localhost:3000/api/health
          curl --fail --silent --show-error http://localhost:3000/source.tar.gz -o "$RUNNER_TEMP/soratra-source.tar.gz"
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import PurePosixPath
          with tarfile.open(os.path.join(os.environ['RUNNER_TEMP'], 'soratra-source.tar.gz')) as archive:
              names = set(archive.getnames())
              required = {'LICENSE', 'NOTICE', 'TRADEMARKS.md', 'Dockerfile', 'soratra.sh', 'compose.yaml', 'docker/compose.test.yaml', 'docker/Caddyfile', '.env.example', 'scripts/package-source.mjs'}
              assert required <= names, f'Missing source files: {required - names}'
              for name in names:
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert not {'.git', 'node_modules', '.next', 'backups'}.intersection(path.parts)
                  assert not any(part.startswith('.env') and part != '.env.example' for part in path.parts)
          PY
      - run: npm run test:e2e
      - name: Inspect failed container startup or tests
        if: failure()
        run: docker compose -f compose.yaml -f docker/compose.test.yaml logs --no-color --tail 200 app migrate scheduler
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose -f compose.yaml -f docker/compose.test.yaml down --volumes --remove-orphans
