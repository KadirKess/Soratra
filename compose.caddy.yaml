# Optional HTTPS on your own domain. Point the domain's DNS at this server, make
# sure ports 80 and 443 are free, set DOMAIN in .env, then run:
#   docker compose -f compose.yaml -f compose.caddy.yaml up -d
services:
  app:
    environment:
      SITE_URL: https://${DOMAIN:?Set DOMAIN to your domain, such as books.example.org}
      TRUSTED_PROXY_IP_HEADER: x-real-ip

  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

configs:
  caddyfile:
    # Caddy overwrites X-Real-IP with the visitor's address, which is what the
    # app trusts for rate limits.
    content: |
      ${DOMAIN} {
        encode
        reverse_proxy app:3000 {
          header_up X-Real-IP {remote_host}
        }
      }

volumes:
  caddy_data:
  caddy_config:
