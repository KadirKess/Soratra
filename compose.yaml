# Soratra: download this file, then run `docker compose up -d` and open
# http://localhost:3000. Optional settings go in a .env file next to it; see
# .env.example in the repository.
name: soratra

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  app:
    image: &soratra-image ghcr.io/kadirkess/soratra:${SORATRA_VERSION:-1}
    ports:
      # 127.0.0.1 keeps Soratra on this computer. Set SORATRA_BIND=0.0.0.0 to
      # reach it from your phone or other devices on your network.
      - '${SORATRA_BIND:-127.0.0.1}:${SORATRA_PORT:-3000}:3000'
    environment:
      SITE_URL: ${SITE_URL:-}
      SEARCH_INDEXING: ${SEARCH_INDEXING:-false}
      TRUSTED_PROXY_IP_HEADER: ${TRUSTED_PROXY_IP_HEADER:-}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      SECURITY_EXPIRES: ${SECURITY_EXPIRES:-}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}
    volumes:
      - config:/config:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: soratra
      POSTGRES_USER: soratra
      POSTGRES_PASSWORD_FILE: /config/postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - config:/config:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U soratra -d soratra']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Runs once: creates the database password on the first start.
  init:
    image: *soratra-image
    command: [soratra, init]
    volumes:
      - config:/config
    restart: 'no'
    logging: *logging

  # A database backup in ./backups once a day, keeping the newest seven.
  backup:
    image: postgres:16-bookworm
    environment:
      PGHOST: db
      PGUSER: soratra
      PGDATABASE: soratra
      KEEP_BACKUPS: ${KEEP_BACKUPS:-7}
    volumes:
      - config:/config:ro
      - ./backups:/backups
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        umask 077
        # ~/.pgpass also lets `docker compose exec backup pg_restore ...` connect.
        printf 'db:5432:soratra:soratra:%s\n' "$$(cat /config/postgres-password)" > /root/.pgpass
        while true; do
          if [ -z "$$(find /backups -maxdepth 1 -name 'soratra-*.dump' -mmin -1380)" ]; then
            name="soratra-$$(date -u +%Y-%m-%d-%H%M).dump"
            if pg_dump --format=custom --file="/backups/$$name.partial"; then
              mv "/backups/$$name.partial" "/backups/$$name"
              echo "Backup written: $$name"
              ls -1t /backups/soratra-*.dump | tail -n +$$((KEEP_BACKUPS + 1)) | xargs -r rm --
            else
              rm -f "/backups/$$name.partial"
              echo "Backup failed; trying again in an hour." >&2
            fi
          fi
          sleep 3600
        done
    depends_on:
      # The app is healthy only after migrations, so the first backup is never
      # of an empty database.
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  postgres_data:
  config:
